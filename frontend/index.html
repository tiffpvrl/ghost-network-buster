<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Verify behavioral health provider directories against real phone answers — ghost network audit tool." />
    <meta property="og:title" content="Ghost Network Buster" />
    <meta property="og:description" content="Parallel verification calls to insurer-listed therapists. See ghost rate and usable contacts." />
    <meta property="og:type" content="website" />
    <title>Ghost Network Buster</title>
    <link rel="icon" type="image/svg+xml" href="/ghost.svg" />
    <link rel="apple-touch-icon" href="/ghost.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&family=Space+Mono:ital,wght@0,400;0,700;1,400&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("gnb_theme");
          if (s !== "dark" && s !== "light") {
            s = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          }
          document.documentElement.setAttribute("data-theme", s);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
