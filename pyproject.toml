[project]
name = "ghost-network-buster"
version = "0.1.0"
description = "Agentic directory audit (mock voice for dev)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    # Plain uvicorn (no uvloop/httptools) keeps wheels small — Cloud Shell home is ~5GB.
    # For faster local servers, pip install 'uvicorn[standard]' in your venv or add an optional extra.
    "uvicorn>=0.32.0",
    "websockets>=12.0,<16",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "fpdf2>=2.8.0",
    "python-docx>=1.1.0",
    "google-adk>=1.31.0",
    "google-cloud-storage>=2.18.0",
    "ijson>=3.2.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]
# Optional native accelerator stack (larger disk / build footprint than plain uvicorn).
performance = ["uvicorn[standard]>=0.32.0"]
vertex = ["google-cloud-aiplatform>=1.70.0"]
pipecat = [
    "pipecat-ai[deepgram,silero]>=0.0.60",
    "twilio>=9.0.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ghost_network_buster*"]

[tool.pytest.ini_options]
# Lets `pytest` find `ghost_network_buster` when run from repo root without `pip install -e .`.
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
